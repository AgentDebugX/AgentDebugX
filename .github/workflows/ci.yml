name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui]"
          python -m pip install pytest pytest-asyncio pytest-cov pytest-mock hypothesis "tomli>=2.0; python_version < '3.11'"

      - name: Run core tests
        run: python -m pytest tests -q

      - name: Compile package
        run: python -m compileall -q src/agentdebug tests

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install project and coverage dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui]"
          python -m pip install pytest pytest-asyncio pytest-cov pytest-mock hypothesis

      - name: Enforce core coverage baseline
        run: >-
          python -m pytest tests -q
          --cov=agentdebug
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-fail-under=40

  pydantic-compat:
    name: Pydantic ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: v1
            spec: 'pydantic>=1.10,<2'
          - label: v2
            spec: 'pydantic>=2,<3'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install compatibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "${{ matrix.spec }}" pytest pytest-asyncio pytest-mock hypothesis

      - name: Run compatibility tests
        run: python -m pytest tests -q

  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install Ruff
        run: python -m pip install "ruff>=0.3,<0.4"

      - name: Run Ruff
        run: ruff check src/agentdebug tests --output-format=github

  type-check:
    name: Mypy contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install project and type-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "mypy>=1.8,<2" "types-setuptools>=69"

      - name: Run Mypy
        run: >-
          mypy
          src/agentdebug/runtime/plugins/types.py
          src/agentdebug/rerun/request.py
          src/agentdebug/rerun/executors/base.py
          src/agentdebug/diagnose/registry.py

  package:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Validate wheel contents
        run: python tests/check_distribution.py dist/*.whl

      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/agentdebugx-smoke
          /tmp/agentdebugx-smoke/bin/python -m pip install dist/*.whl
          /tmp/agentdebugx-smoke/bin/agentdebug --help
          /tmp/agentdebugx-smoke/bin/python -c "import agentdebug; print(agentdebug.__version__)"
          # GUI RCA must work off a core install, with no optional extras present.
          /tmp/agentdebugx-smoke/bin/python -c "
          from agentdebug.gui import run_rca, load_trajectory, tag_from_rca, TAXONOMY_CATEGORIES
          print('gui RCA surface OK on a core install')
          "

  gui-extras-tests:
    name: GUI suite with extras (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install project with the optional GUI extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,gui-memory,gui-app]"
          python -m pip install pytest

      # The `tests` job runs tests/gui too, but skips whatever needs an extra.
      # Assert the extras really landed, so a broken install shows up as a
      # failure here instead of as a silently smaller test run.
      - name: Verify the optional GUI layers are importable
        run: |
          python -c "
          import importlib
          for name in (
              'agentdebug.gui.memory.lesson_memory',
              'agentdebug.gui.tools.lesson_explorer',
              'agentdebug.gui.pipeline.orchestrator',
              'agentdebug.gui.perplexity_adapter',
              'agentdebug.gui.vis.debugger_app',
              'agentdebug.gui.__main__',
          ):
              importlib.import_module(name)
          print('optional GUI layers importable; tests/gui will not skip')
          "

      - name: Run the full GUI suite
        run: python -m pytest tests/gui -q
