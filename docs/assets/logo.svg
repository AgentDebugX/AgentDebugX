<svg xmlns="http://www.w3.org/2000/svg" width="906" height="574" viewBox="0 0 906 574">
  <title>Robot Search Vector Icon</title>
  <desc>Clean vector redraw based on the supplied raster image.</desc>
  <g fill="none" stroke="#061229" stroke-linecap="round" stroke-linejoin="round">
    <!-- Magnifying glass -->
    <circle cx="444" cy="240" r="184" stroke-width="24"/>
    <path d="M566 383 L606 420" stroke-width="28"/>
    <path d="M605 418 L701 511" stroke-width="56"/>
  </g>

  <!-- Robot antenna -->
  <path d="M444 142 L444 195" stroke="#061229" stroke-width="13" stroke-linecap="round"/>
  <circle cx="444" cy="123" r="23" fill="#1E4AF2"/>

  <!-- Robot shell -->
  <path d="M341 344 L341 251 C341 222 365 201 395 201 L493 201 C524 201 549 223 549 253 L549 344"
